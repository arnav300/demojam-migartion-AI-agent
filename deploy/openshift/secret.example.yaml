# EXAMPLE ONLY: placeholders, never real values. Not listed in kustomization.yaml.
# Create the real Secret with `oc create secret generic copilot-secrets ...` (see README.md).
# If you keep a filled-in copy locally, name it secret.yaml; it is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: copilot-secrets
  namespace: demojam-copilot
type: Opaque
stringData:
  # AAP 2.4 source controller API, including the /api/v2 path. Read-only use.
  AAP_SOURCE_URL: "https://<aap24-host>/api/v2"
  AAP_SOURCE_TOKEN: "<aap24-admin-token>"
  # AAP 2.6 target via Platform Gateway, including the /api/controller/v2 path.
  AAP_TARGET_URL: "https://<aap26-host>/api/controller/v2"
  AAP_TARGET_TOKEN: "<aap26-admin-token>"
  # Optional AI layer. Leave AI_ENDPOINT out of the Secret to run with AI off.
  AI_ENDPOINT: "https://<granite-inferenceservice-url>"
  AI_MODEL: "<model-id-from-/v1/models>"
  AI_TOKEN: "<granite-token>"
