# C11 live dashboard: reads the shared PVC read-only and GETs counts from the AAP 2.6 target.
# The PVC is ReadWriteOnce, so this pod must land on the same node as the running Job
# (the podAffinity below asks for that while a copilot Job pod exists).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-dashboard
  labels:
    app.kubernetes.io/name: copilot
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: copilot
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copilot
        app.kubernetes.io/component: dashboard
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values: [migrate, premigration]
      containers:
        - name: dashboard
          image: copilot:latest
          imagePullPolicy: Always
          workingDir: /app/aap-bridge
          command:
            - /app/aap-bridge/.venv/bin/aap-migrate
            - --config
            - /app/config/config.yaml
            - --log-file
            - /tmp/dashboard.log
            - dashboard
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          env:
            - name: HOME
              value: /tmp
            - name: MIGRATION_STATE_DB_PATH
              value: sqlite:////app/state/migration_state.db
            - name: PATHS__EXPORT_DIR
              value: /app/state/exports
            - name: SOURCE__URL
              valueFrom:
                secretKeyRef: {name: copilot-secrets, key: AAP_SOURCE_URL}
            - name: SOURCE__TOKEN
              valueFrom:
                secretKeyRef: {name: copilot-secrets, key: AAP_SOURCE_TOKEN}
            - name: TARGET__URL
              valueFrom:
                secretKeyRef: {name: copilot-secrets, key: AAP_TARGET_URL}
            - name: TARGET__TOKEN
              valueFrom:
                secretKeyRef: {name: copilot-secrets, key: AAP_TARGET_TOKEN}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: state
              mountPath: /app/state
              readOnly: true
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: copilot-state
            readOnly: true
        - name: config
          configMap:
            name: copilot-config
---
apiVersion: v1
kind: Service
metadata:
  name: copilot-dashboard
  labels:
    app.kubernetes.io/name: copilot
    app.kubernetes.io/component: dashboard
spec:
  selector:
    app.kubernetes.io/name: copilot
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: copilot-dashboard
  labels:
    app.kubernetes.io/name: copilot
    app.kubernetes.io/component: dashboard
spec:
  to:
    kind: Service
    name: copilot-dashboard
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
