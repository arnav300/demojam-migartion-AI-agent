apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demojam-copilot

labels:
  - pairs:
      app.kubernetes.io/part-of: demojam-copilot

resources:
  - namespace.yaml
  - pvc.yaml
  - imagestream.yaml
  - buildconfig.yaml
  - job-premigration.yaml
  - job-migrate.yaml
  # secret.example.yaml is intentionally not listed: create the Secret with `oc create secret`.

# config.yaml is a copy of ../../config/config.yaml (kustomize cannot read files
# outside this directory). tests/unit/deploy/test_openshift_config.py keeps them in sync.
configMapGenerator:
  - name: copilot-config
    files:
      - config.yaml
